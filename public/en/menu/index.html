<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARMADA RESIDENCE — Café &amp; Restaurant · Menu</title>
<meta name="description" content="Interactive menu — ARMADA RESIDENCE Café & Restaurant, Airport Road, Taif.">
<meta name="theme-color" content="#211217">
<link rel="icon" href="../../menu/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="../../menu/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../menu/assets/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../menu/assets/icons/icon-180.png">
<link rel="manifest" href="../../menu/site.webmanifest">
<link rel="preload" as="image" href="../../menu/assets/frames/hot_drinks/desktop/frame_0000.webp">
<link rel="preload" as="image" href="../../menu/assets/frames/breakfast/desktop/frame_0000.webp">
<link rel="stylesheet" href="../../fonts/menu-fonts.css">
<style>
:root{
  --cherry:#211217; --burgundy:#741426; --porcelain:#F3E8D7; --mineral:#A9C1CA; --bronze:#A97C50;
  --ink:var(--porcelain); --ink-dim:rgba(243,232,215,.62); --line:rgba(243,232,215,.14);
  --ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --en:"Manrope","Helvetica Neue",Arial,sans-serif;
  --top:56px; --nav:44px;
  --scene:1.5; /* viewport heights per scene */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--cherry);color:var(--ink)}
body{font-family:var(--ar);font-weight:400;line-height:1.55;overflow-x:hidden}
[dir="ltr"] body, body.ltr{font-family:var(--en)}
.num,.price,.en{font-family:var(--en);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--mineral);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;height:var(--top);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;
  background:linear-gradient(to bottom,rgba(33,18,23,.82),rgba(33,18,23,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{grid-column:2;display:block;height:34px;justify-self:center;padding-top:2px}
.brand img{height:100%;width:auto;display:block}
.top .tools{grid-column:3;justify-self:end;display:flex;gap:8px;align-items:center}
.top .tools.start{grid-column:1;justify-self:start}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;font-family:var(--en);font-size:12px;letter-spacing:.06em;font-weight:600}
.lang button{padding:6px 10px;color:var(--ink-dim)}
.lang button[aria-pressed="true"]{background:var(--porcelain);color:var(--cherry)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:4px;font-size:13px;background:rgba(33,18,23,.35);backdrop-filter:blur(8px)}
.cartbtn .count{font-family:var(--en);font-weight:600;min-width:20px;height:20px;border-radius:10px;background:var(--burgundy);display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
.cartbtn .count:empty{display:none}
.fab{position:fixed;z-index:45;inset-inline-end:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;
  background:var(--burgundy);color:var(--porcelain);display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(243,232,215,.28);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}.fab:active{transform:scale(.96)}
.fab .count{position:absolute;top:-4px;inset-inline-end:-4px;min-width:24px;height:24px;border-radius:12px;padding:0 7px;background:var(--porcelain);color:var(--cherry);font-family:var(--en);font-weight:600;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.fab .count:empty{display:none}
.fab.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.14)}}
.cartbtn.clear{color:var(--ink-dim)}
.cartbtn.pdf{text-decoration:none;font-family:var(--en);font-weight:600;font-size:12px;letter-spacing:.04em;padding:6px 10px}
@media (max-width:560px){ .cartbtn.pdf{display:none} }
.rail a.pdf{display:none;white-space:nowrap;padding:5px 11px;border-radius:999px;font-size:13px;color:var(--ink-dim);border:1px solid var(--line);text-decoration:none;font-family:var(--en);font-weight:600}
@media (max-width:560px){ .rail a.pdf{display:inline-flex} }.cartbtn.clear:hover{color:var(--porcelain)}
.btn.clearbtn{color:var(--ink-dim)}

/* section rail */
.rail{position:fixed;top:calc(var(--top) + env(safe-area-inset-top,0px));left:0;right:0;z-index:39;height:var(--nav);
  display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:center;
  mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.rail::-webkit-scrollbar{display:none}
.rail button{white-space:nowrap;padding:5px 11px;border-radius:999px;font-size:13px;color:var(--ink-dim);border:1px solid transparent}
.rail button.closed{opacity:.5;cursor:default;font-size:12px}
.rail button[aria-current="true"]{color:var(--porcelain);border-color:var(--line);background:rgba(33,18,23,.5)}

/* ---------- scenes ---------- */
main{position:relative}
.scene{position:relative;height:calc(var(--len,1.5) * 100vh);height:calc(var(--len,1.5) * 100svh)} /* same unit as the pinned stage: no band between scenes when mobile toolbars change the viewport */
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--cherry)}
.glow{position:absolute;inset:-12%;width:124%;height:124%;filter:blur(34px) saturate(1.05) brightness(.9);opacity:.95}
.frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.rm .frame{opacity:1}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(33,18,23,.74),rgba(33,18,23,.42) 32%,rgba(33,18,23,.42) 68%,rgba(33,18,23,.74))}
.overlay>*{pointer-events:auto}

/* title block */
.ttl{position:absolute;top:calc(var(--top) + var(--nav) + env(safe-area-inset-top,0px) + 6px);inset-inline-start:max(18px,3vw);max-width:min(44vw,520px);
  opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.ttl.in{opacity:1;transform:none}
.ttl h2{margin:0;font-weight:500;font-size:clamp(26px,3.6vw,44px);line-height:1.15;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(33,18,23,.8)}
.ttl .sub{margin:6px 0 0;color:var(--ink-dim);font-size:14px;font-family:var(--en);letter-spacing:.02em}
[dir="rtl"] .ttl .sub{font-family:var(--ar)}
.ttl .hair{width:56px;height:1px;background:var(--bronze);margin-top:12px;opacity:.9}

/* items panel (desktop: side ledger; mobile: bottom sheet) */
.panel{position:absolute;inset-inline-start:max(18px,3vw);top:calc(var(--top) + var(--nav) + env(safe-area-inset-top,0px) + 118px);bottom:max(20px,3vh);width:min(32vw,440px);
  overflow:hidden;padding:2px;opacity:0;transition:opacity .4s;background:none}
.stage.rm .panel{overflow:auto}
.panel.in{opacity:1}
.panel::-webkit-scrollbar{display:none}
.grp{padding:6px 0 2px}
.grp h3{margin:0 0 6px;display:inline-block;font-size:13px;font-weight:500;color:var(--porcelain);opacity:.85;letter-spacing:.04em;padding:4px 11px;border-radius:11px;background:rgba(243,232,215,.09);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06); box-shadow:inset 0 1px 1px rgba(255,255,255,.42),inset 0 -1px 1px rgba(255,255,255,.14),inset 1px 0 1px rgba(255,255,255,.22),inset -1px 0 1px rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.22)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:7px 13px;border-radius:14px;position:relative;background:rgba(243,232,215,.09);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.42),inset 0 -1px 1px rgba(255,255,255,.14),inset 1px 0 1px rgba(255,255,255,.22),inset -1px 0 1px rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.22);text-shadow:0 1px 8px rgba(33,18,23,.55)}
.ring{position:absolute;inset:-2px;border-radius:inherit;padding:2px;pointer-events:none;overflow:hidden;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:ringfade 1.6s ease-out forwards}
.ring::before{content:"";position:absolute;left:50%;top:50%;width:300%;padding-top:300%;transform:translate(-50%,-50%) rotate(0deg);transform-origin:center;
  background:conic-gradient(from 0deg,transparent 0 62%,rgba(243,232,215,.35) 78%,#F3E8D7 88%,transparent 100%);animation:ringspin 1.1s cubic-bezier(.3,.6,.3,1) 1}
@keyframes ringspin{to{transform:translate(-50%,-50%) rotate(720deg)}}
@keyframes ringfade{0%,70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ .ring::before{animation:none;background:rgba(243,232,215,.7)} }
.chip::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.14),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.06))}
.row .nm{font-size:16px;line-height:1.3}
.row .nm small{display:block;color:var(--ink-dim);font-size:12px;font-family:var(--en)}
[dir="rtl"] .row .nm small{font-family:var(--ar)}
.row .kcal{color:var(--ink-dim);font-size:12px;font-family:var(--en);white-space:nowrap}
.row .price{font-weight:600;font-size:16.5px;white-space:nowrap}
.price i{font-style:normal;font-size:12px;color:var(--ink-dim);margin-inline-start:3px}
.row .pend{font-size:12px;color:var(--mineral);white-space:nowrap}
.row .add{width:28px;height:28px;border-radius:9px;border:1px solid rgba(243,232,215,.45);background:rgba(243,232,215,.08);display:grid;place-items:center;font-family:var(--en);font-size:18px;line-height:1;transition:background .15s,transform .15s}
.row .add:hover{background:rgba(243,232,215,.12)}
.row .add:active{transform:scale(.94)}
.qty{display:inline-flex;align-items:center;border:1px solid rgba(243,232,215,.45);background:rgba(243,232,215,.08);border-radius:9px;overflow:hidden;font-family:var(--en);font-weight:600}
.qty button{width:26px;height:26px;display:grid;place-items:center;font-size:16px}
.qty button:hover{background:rgba(243,232,215,.12)}
.qty span{min-width:22px;text-align:center;font-size:13px}
.opts{display:flex;gap:6px;margin-inline-start:6px}
.opts button{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim)}
.opts button[aria-pressed="true"]{color:var(--porcelain);border-color:var(--bronze)}
.row.pending .nm{color:var(--ink-dim)}
.pnote{margin:4px 0 0;padding:6px 12px;font-size:11.5px;color:var(--porcelain);opacity:.8;line-height:1.5;border-radius:14px;background:rgba(243,232,215,.09);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06); box-shadow:inset 0 1px 1px rgba(255,255,255,.42),inset 0 -1px 1px rgba(255,255,255,.14),inset 1px 0 1px rgba(255,255,255,.22),inset -1px 0 1px rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.22)}

/* mobile: compact list of detached chips, always visible, scrolls internally */
@media (max-width:820px), (max-aspect-ratio: 1/1){
  :root{--listh:33vh}
  .ttl{max-width:calc(100vw - 36px)}
  .ttl h2{font-size:clamp(22px,6vw,30px)}
  .ttl .sub{font-size:12px;margin-top:2px}.ttl .hair{margin-top:6px}
  .panel{position:absolute;inset-inline:14px;top:calc(var(--top) + var(--nav) + env(safe-area-inset-top,0px) + 96px);bottom:0;width:auto;
    padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));border-radius:0;background:none;
    mask-image:linear-gradient(to bottom,transparent,#000 12px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 12px)}
  .grp{padding:4px 0 2px}.grp h3{font-size:11.5px}
  .row{margin-bottom:5px}.chip{padding:5px 10px}
  .row .nm{font-size:15px}.row .price{font-size:15.5px}.row .add{width:28px;height:28px}
  .qty button{width:24px;height:24px}
}
/* VIP featured card */
.vipcard{position:absolute;inset-inline-start:max(18px,3vw);bottom:max(24px,4vh);width:min(34vw,440px);padding:22px 24px;border:1px solid var(--bronze);border-radius:6px;background:rgba(33,18,23,.72)}
.vipcard h3{margin:0 0 6px;font-size:22px;font-weight:500}.vipcard p{margin:0 0 14px;color:var(--ink-dim);font-size:14px;line-height:1.6}
.vipcard .cta{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;background:var(--burgundy);border-radius:4px;font-weight:500}
@media (max-width:820px), (max-aspect-ratio: 1/1){ .vipcard{inset-inline:16px;width:auto;bottom:16px} }

/* ---------- cart drawer ---------- */
.dim{position:fixed;inset:0;background:rgba(33,18,23,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100vw);z-index:51;background:var(--cherry);border-inline-start:1px solid var(--line);
  transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer h2{margin:0;font-size:20px;font-weight:500}
.drawer .x{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;font-size:22px;line-height:1}
.drawer .list{flex:1;overflow:auto;padding:6px 20px}
.drawer .empty{color:var(--ink-dim);padding:32px 0;text-align:center;font-size:14px}
.cl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cl .nm{font-size:15px}.cl .nm small{display:block;color:var(--ink-dim);font-size:12px}
.cl .line{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cl .rm{color:var(--ink-dim);font-size:12px;padding:4px 0}
.cl .rm:hover{color:var(--porcelain)}
.drawer footer{padding:14px 20px 18px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:12px}
.tot .price{font-size:22px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border-radius:4px;font-size:15px;font-weight:500;text-decoration:none}
.btn.primary{background:var(--burgundy);color:var(--porcelain)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border:1px solid var(--line);margin-top:8px;color:var(--porcelain)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.hint{margin:10px 0 0;font-size:12px;color:var(--ink-dim);line-height:1.5}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--porcelain);color:var(--cherry);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- footer ---------- */
footer.site{padding:56px 24px 72px;text-align:center;color:var(--ink-dim);font-size:13px;line-height:1.9;border-top:1px solid var(--line);background:var(--cherry)}
footer.site img{height:40px;margin-bottom:16px;opacity:.9}
footer.site .hair{width:48px;height:1px;background:var(--bronze);margin:14px auto}
footer.site a{text-decoration:none;color:var(--porcelain)}
footer.site .cfg{margin-top:10px;font-size:11px;opacity:.7}
footer.site .social{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
footer.site .sbtn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:4px;border:1px solid var(--line);color:var(--porcelain);font-size:14px;text-decoration:none}
footer.site .sbtn.wa{background:var(--burgundy);border-color:var(--burgundy)}
footer.site .sbtn:hover{filter:brightness(1.12)}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  .ttl,.row,.panel,.drawer,.dim,.toast{transition:none}
}
.stage .lo{position:absolute;bottom:14px;inset-inline-end:14px;font-family:var(--en);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;opacity:0;transition:opacity .3s}
.stage .lo.on{opacity:.8}

/* ---------- site bar (armadaresidence.com integration, 10 Oct 2026) ---------- */
:root{--site-bar:44px}
.site-bar{position:sticky;top:0;z-index:46;height:var(--site-bar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;padding-top:env(safe-area-inset-top,0px);background:#142A3B;color:#F3EFE7;border-bottom:1px solid rgba(243,239,231,.14);font-family:var(--ar);font-size:13px}
[dir="ltr"] .site-bar{font-family:var(--en)}
.site-bar a{color:#F3EFE7;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.site-bar a:hover{color:#C9A27A}
.site-bar__brand img{height:26px;width:auto;display:block;padding:6px 0}
.site-bar__lang{font-family:var(--en);font-weight:600;letter-spacing:.02em;padding:0 8px;border:1px solid rgba(243,239,231,.3);border-radius:4px;min-height:30px!important;height:30px}
[dir="ltr"] .site-bar__lang{font-family:var(--ar)}
.site-bar svg{width:16px;height:16px}
[dir="rtl"] .site-bar svg{transform:scaleX(-1)}
/* the legacy fixed/sticky layers sit below the site bar */
.top{top:calc(var(--site-bar) + env(safe-area-inset-top,0px))}
.rail{top:calc(var(--site-bar) + var(--top) + env(safe-area-inset-top,0px))}
.stage{top:var(--site-bar);height:calc(100vh - var(--site-bar));height:calc(100svh - var(--site-bar))}
</style>
</head>
<body>
<div class="site-bar"><h1 class="sr">Armada Residence Café & Restaurant menu</h1><a class="site-bar__back" href="../../en/"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.8l4.6-4.6L11 5l-7 7 7 7 1.4-1.4L7.8 13H20z"/></svg><span>Back to the site</span></a><a class="site-bar__brand" href="../../en/" aria-label="Armada Residence"><img src="../../brand/logo-horizontal_Porcelain.svg" alt="Armada Residence" width="143" height="32"></a><a class="site-bar__lang" href="../../menu/" hreflang="ar" lang="ar">العربية</a></div>
<a class="sr" href="#scenes" data-i18n="skip">تخطَّ إلى القائمة</a>

<header class="top">
  <div class="tools start">
    <button class="cartbtn clear" id="clearTop" hidden><span data-i18n="clear">مسح</span></button>
    <a class="cartbtn pdf" id="pdfTop" href="../../menu/assets/ARMADA_Cafe_Restaurant_Menu_2026.pdf" target="_blank" rel="noopener" download><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>PDF</span></a>
  </div>
  <a class="brand" href="#" id="home" aria-label="ARMADA RESIDENCE — Café &amp; Restaurant"><img src="../../menu/assets/ARMADA_RESIDENCE_Logo_porcelain.png" alt="ARMADA RESIDENCE · Café &amp; Restaurant"></a>
  <div class="tools">
    <div class="lang" role="group" aria-label="Language">
      <button id="langAr" aria-pressed="true" lang="ar">AR</button><button id="langEn" aria-pressed="false" lang="en">EN</button>
    </div>
  </div>
</header>
<nav class="rail" id="rail" aria-label="Sections"></nav>

function setLang(l){
  if(l===lang) return;
  // keep the same scene and frame: remember where in its section the viewport top sits, then re-derive after relayout
  const y=scrollY; let sc=null, frac=0;
  for(const c of scenes){ const t=c.el.offsetTop, h=c.el.offsetHeight; if(y>=t && y<t+h){ sc=c; frac=(y-t)/Math.max(1,h-vh); break; } }

  if(sc){ scrollTo(0, Math.round(sc.el.offsetTop + Math.min(1,frac)*Math.max(0,sc.el.offsetHeight-vh))); } else scrollTo(0,y);

/* ---------- frame engine ---------- */
const FW=720, FH=898;
let vw=0,vh=0,dpr=1;
function frameSet(){ // responsive set: the small set only when the drawn frame needs ≤ 520 device px of width
  if(MODE!=="files") return "desktop"; const sets=FRAMES[SECTIONS[0].folder].sets; if(!sets.mobile) return "desktop";
  const need = drawScale()*FW*dpr; return need<=sets.mobile.width*1.08 ? "mobile" : "desktop";
}
function listTop(){ // mobile: the compact list occupies the bottom of the viewport
  return isNarrow()? Math.round(vh*(1-0.33)) : vh;
}
function layout(){
  const W=vw*dpr,H=vh*dpr; const sW=W/FW, sH=H/FH;
  if(!isNarrow()){ const s=Math.min(sH, 1.25*dpr); return {W,H,s,dw:FW*s,dh:FH*s}; }   // never upscale the 720 source beyond 1.25× — extend the scene instead
  const s=Math.min(sH, sW*1.22, 1.25*dpr); return {W,H,s,dw:FW*s,dh:FH*s};
}
function drawScale(){ return layout().s/dpr; }
function setupCanvases(){
  vw=innerWidth; const st=document.querySelector(".stage"); vh=st?st.clientHeight:innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  scenes.forEach(sc=>{ sc.frame.width=Math.round(vw*dpr); sc.frame.height=Math.round(vh*dpr); sc.glow.width=48; sc.glow.height=Math.round(48*vh/vw); sc.drawn=-1; });
  fitLengths();
}
function fitLengths(){ // scroll distance = base length + however much of the list does not fit on screen
  if(RM) return;
  scenes.forEach(sc=>{ const base=sc.sec.id==="snacks"?CONFIG.snacksLength:CONFIG.sceneLength;
    sc.ov = sc.panel ? Math.max(0, sc.panel.scrollHeight - sc.panel.clientHeight) : 0;
    sc.el.style.setProperty("--len", (base + sc.ov/Math.max(1,vh)).toFixed(3)); });
}
function nearestLoaded(sc,i){
  if(sc.imgs[i]&&sc.imgs[i].ok) return sc.imgs[i];
  for(let d=1;d<sc.count;d++){ const a=sc.imgs[i-d], b=sc.imgs[i+d]; if(a&&a.ok) return a; if(b&&b.ok) return b; }
  return null;
}
function draw(sc,i,force){
  const img=nearestLoaded(sc,i); if(!img) return false;
  const key=img.i;
  if(!force && sc.drawn===key) return true;
  const ctx=sc.frame.getContext("2d"); const L=layout(); const {W,H,dw,dh}=L;
  const dx=(W-dw)/2, dy=L.cy!=null ? L.cy-dh/2 : (H-dh)/2;
  ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation="source-over"; ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.drawImage(img,dx,dy,dw,dh);
  ctx.globalCompositeOperation="destination-out";
  if(dw<W-1){ const f=Math.min(dw*0.14,150*dpr);
    let g=ctx.createLinearGradient(dx,0,dx+f,0); g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.fillRect(dx-1,0,f+1,H);
    g=ctx.createLinearGradient(dx+dw,0,dx+dw-f,0); g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.fillRect(dx+dw-f,0,f+1,H); }
  if(dy>0.5 || dy+dh<H-0.5){ const f=Math.min(dh*0.12,120*dpr);
    let g=ctx.createLinearGradient(0,dy,0,dy+f); g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.fillRect(0,dy-1,W,f+1);
    g=ctx.createLinearGradient(0,dy+dh,0,dy+dh-f); g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.fillRect(0,dy+dh-f,W,f+1); }

  const gc=sc.glow.getContext("2d"); const gw=sc.glow.width,gh=sc.glow.height; const gs=Math.max(gw/FW,gh/FH);
  gc.fillStyle="#211217"; gc.fillRect(0,0,gw,gh); gc.drawImage(img,(gw-FW*gs)/2,(gh-FH*gs)/2,FW*gs,FH*gs);
  sc.drawn=key; return true;
}

/* loading: only a window around the frame being shown, then a lookahead in the scroll direction, then a slow trickle
   through the rest of the active scene. Neighbouring scenes get their first frames when they come within a viewport. */
const MAXC=5, NEAR=6, AHEAD=20; let inflight=0; const queue=[]; let activeScene=null;
function want(sc,i){ if(i<0||i>=sc.count||sc.imgs[i]) return; const img=new Image(); img.i=i; img.ok=false; img.sc=sc; sc.imgs[i]=img; queue.push(img); }
function pump(){
  if(inflight>=MAXC||!queue.length) return;
  const A=activeScene; queue.sort((a,b)=>((a.sc===A?0:(a.pf?PREFETCH_RANK:1e6))+Math.abs(a.i-a.sc.idx))-((b.sc===A?0:(b.pf?PREFETCH_RANK:1e6))+Math.abs(b.i-b.sc.idx)));
  while(inflight<MAXC && queue.length){ const img=queue.shift(); inflight++;
    img.onload=()=>{ img.ok=true; img.sc.loaded++; inflight--; requestDraw(false); pump(); };
    img.onerror=()=>{ inflight--; img.sc.imgs[img.i]=null; pump(); };
    img.src=img.sc.url(img.i); }
}
function scheduleWindow(sc,i,dir){
  for(let d=0; d<=NEAR; d++){ want(sc,i+d); want(sc,i-d); }
  for(let d=NEAR+1; d<=AHEAD; d++) want(sc, i + d*(dir>=0?1:-1));
  if(sc===activeScene && inflight===0 && !queue.length){ // trickle: next few unloaded frames beyond the lookahead
    let n=0; for(let k=i+AHEAD+1; k<sc.count && n<4; k++) if(!sc.imgs[k]){ want(sc,k); n++; }
    for(let k=i-NEAR-1; k>=0 && n<4; k--) if(!sc.imgs[k]){ want(sc,k); n++; }
  }
  pump();
}


/* next-scene prefetch (10 Oct 2026): at 60 % of the active scene the first 20 frames of the next scene are requested,
   then the rest trickle in while the network is idle — so the hand-over between scenes never shows a gap. */
const PREFETCH_AT=0.6, PREFETCH_FIRST=20, PREFETCH_TRICKLE=4, PREFETCH_RANK=7;
function prefetchNext(sc){
  if(!sc.pf){ sc.pf=true; for(let k=0;k<Math.min(PREFETCH_FIRST,sc.count);k++){ want(sc,k); if(sc.imgs[k]) sc.imgs[k].pf=true; } pump(); return; }
  if(inflight<MAXC && queue.length<PREFETCH_TRICKLE){ let n=0; for(let k=PREFETCH_FIRST;k<sc.count && n<PREFETCH_TRICKLE;k++) if(!sc.imgs[k]){ want(sc,k); n++; } if(n) pump(); }
}
let activeIdx=0, lastY=0, scrollDir=1, rafPending=false, forceNext=false;
function requestDraw(force){ if(force) forceNext=true; if(rafPending) return; rafPending=true; requestAnimationFrame(()=>{ rafPending=false; const f=forceNext; forceNext=false; tick(f); }); }
function progressOf(sc){ const r=sc.el.getBoundingClientRect(); const range=Math.max(1,r.height-sc.stage.clientHeight); return Math.min(1,Math.max(0,-r.top/range)); }
function tick(force){

  scenes.forEach((sc,si)=>{ const r=sc.el.getBoundingClientRect(); if(r.top<=vh*0.5 && r.bottom>vh*0.5) act=si; });
  if(scenes[act]!==activeScene){ activeScene=scenes[act]; }
  let pendingLoads=false;
  scenes.forEach((sc,si)=>{
    const r=sc.el.getBoundingClientRect();
    const near = r.bottom>-vh*0.5 && r.top<vh*1.5;
    sc.visible = near;
    if(!near){ if(sc.panel) sc.panel.classList.remove("in"); sc.ttl.classList.remove("in"); return; }
    const p=progressOf(sc);
    const i = RM ? sc.count-1 : Math.round(p*(sc.count-1));
    sc.idx=i;
    if(sc===activeScene && p>=PREFETCH_AT && scenes[si+1]) prefetchNext(scenes[si+1]);
    if(RM){ want(sc,sc.count-1); pump(); }
    else if(r.top<vh*1.05 && r.bottom>-vh*0.1) scheduleWindow(sc,i,sc===activeScene?scrollDir:1);
    else { want(sc,0); pump(); }
    if(sc.panel && !RM && sc.ov>0) sc.panel.scrollTop = p*sc.ov;   // the list glides in step with the frames
    const ok=draw(sc,i,force);
    const exact = sc.imgs[i]&&sc.imgs[i].ok; if(!exact) pendingLoads=true;
    sc.lo.classList.toggle("on",!ok);
    const inView = r.top<vh && r.bottom>0;   // overlay travels with its scene edge, so the next section arrives with its title and items already in place
    sc.ttl.classList.toggle("in", RM || inView || si===0 && r.top>=0);
    if(sc.panel) sc.panel.classList.toggle("in", RM || inView || si===0 && r.top>=0);
  });
  if(act!==activeIdx||force){ activeIdx=act; rail.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-current",i===act)); const ab=rail.children[act]; if(ab) ab.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"}); }
}
addEventListener("scroll",()=>requestDraw(false),{passive:true});
addEventListener("resize",()=>{ setupCanvases(); requestDraw(true); });
addEventListener("orientationchange",()=>setTimeout(()=>{setupCanvases();requestDraw(true);},200));

buildScenes();
activeScene=scenes[0];
if(RM){ want(scenes[0],scenes[0].count-1); } else { want(scenes[0],0); scheduleWindow(scenes[0],0,1); }
pump();
requestDraw(true);
</script>
