# Supabase CLI config — only what this project sets; everything else uses the CLI defaults.
# Remote project: armada-residence (ref wwzxwettsuwtakwwbfly).
project_id = "armada-residence"

[functions.booking-request]
# Public endpoint for the booking and partner-enquiry forms: no JWT (the form posts without a session);
# BOOKING_ALLOWED_ORIGINS (Supabase secret) limits the browser origins.
verify_jwt = false

# Careers page (28 Oct 2026): the public job-application form (multipart, CV attached) and the pg_cron sweep (its own
# JOB_SWEEP_TOKEN header) — no JWT; BOOKING_ALLOWED_ORIGINS limits the browser origins.
[functions.job-application]
verify_jwt = false

# Phase 2a dashboard functions (DECISIONS.md 2026-10-25): signed-in dashboard users only. Each forwards the caller's
# JWT to the database, so RLS decides; booking-admin sends the confirmation / cancellation emails, admin-users
# manages logins (admin only).
[functions.booking-admin]
verify_jwt = true

[functions.admin-users]
verify_jwt = true

# Phase 2a.1 (26 Oct 2026): triggers the website's deploy workflow (workflow_dispatch) after a Settings / room
# availability change; the caller needs edit on settings or rooms (checked through my_staff as the user).
[functions.site-rebuild]
verify_jwt = true

# Dashboard password rule (Ahmed, 26 Oct 2026): at least 8 characters, no required character classes — the dashboard
# itself refuses spaces and anything outside printable ASCII before the call (admin/src/lib/password.ts). Leaked-password
# protection (HaveIBeenPwned) is NOT a key of this file: `config push` cannot change it, and it stays ON in the project.
[auth]
minimum_password_length = 8
password_requirements = ""

# Phase 2a.2 step 2 (Ahmed, 26 Oct 2026): the second step is the email code (login-code function) — TOTP is off for
# everyone. Applied together with migration 20261026000600 (internal.me() no longer accepts an aal2 claim alone).
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Auth email templates (phase 2a.1, 26 Oct 2026). token_hash links: the browser verifies the one-time token only when
# the user presses «متابعة» on /set-password, so a mail scanner opening the link cannot consume it and the link works in
# any browser (no PKCE code verifier needed). Subjects keep the AR- tag for the Hostinger webmail filters.
# `supabase config push` writes ONLY the keys declared here (everything else in Auth stays as set in the dashboard);
# preview with `supabase config diff --project-ref <ref>`.
[auth.email.template.invite]
subject = "دعوة إلى لوحة أرمادا ريزيدنس — AR-INVITE"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "تعيين كلمة المرور — لوحة أرمادا ريزيدنس — AR-RESET"
content_path = "./supabase/templates/recovery.html"

# Phase 2a.2 (26 Oct 2026): the second sign-in step — sends the 6-digit code by email to the signed-in user (the user's
# JWT; verification is public.verify_login_code as that user).
[functions.login-code]
verify_jwt = true

# C4 (28 Oct 2026): bilingual label suggestions — a translation suggestion for the dashboard's label pairs (the user's
# JWT; the staff check, cache and rate limit run in the database as the user; claude-haiku-5-5 through
# ANTHROPIC_API_KEY, answers `unavailable` without it).
[functions.label-suggest]
verify_jwt = true
