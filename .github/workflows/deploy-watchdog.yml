name: Deploy watchdog

# Every 30 minutes (Ahmed, 5 Nov 2026): the live site's /version.json (written by build.py) against main's HEAD, and the
# dashboard's publish jobs still waiting for their build; when the site is behind and no deploy is queued or running, it
# dispatches deploy.yml. Covers a push GitHub never turned into a run, a publish whose dispatch failed. Every decision is
# in the run's log and summary (scripts/deploy-watchdog.mjs). workflow_dispatch: `pretend_live_commit` makes a
# deliberate mismatch for a test; `dry_run` decides and logs without dispatching. When it stops because the last deploy
# failed — or the live commit is current but the newest deploy (a dashboard rebuild) failed — it reports the stop to the
# Edge Function site-deploy-report, which emails the admins once per failed run (6 Nov 2026).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pretend_live_commit:
        description: test only — treat the live site as serving this commit (a deliberate mismatch)
        required: false
        default: ''
      dry_run:
        description: decide and log, dispatch nothing
        type: boolean
        default: false
      alert_test:
        description: only send a sample deploy alert «[تجربة]» (site-deploy-report test mode) — sink = Resend's sink, admin = the active admins; no watchdog run
        type: choice
        options: ['none', 'sink', 'admin']
        default: 'none'

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            content/seo.json
            scripts/deploy-watchdog.mjs
            scripts/site-deploy-report.mjs
          sparse-checkout-cone-mode: false
      # the project's Node (package.json engines), not the runner's default (13 Nov 2026)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Sample deploy alert (alert_test)
        if: ${{ inputs.alert_test == 'sink' || inputs.alert_test == 'admin' }}
        run: node scripts/site-deploy-report.mjs test ${{ inputs.alert_test }}
        env:
          PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Compare the live site with main and the dashboard's publishes
        if: ${{ inputs.alert_test != 'sink' && inputs.alert_test != 'admin' }}
        run: node scripts/deploy-watchdog.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRETEND_LIVE: ${{ inputs.pretend_live_commit }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
