# Weekly backup of Supabase Storage to Cloudflare R2 (Ahmed, 9 Nov 2026 — DECISIONS.md 2026-11-09 «Weekly Storage
# backup to R2»; restore: docs/backup-restore.md). Every Storage bucket (job-applications excepted — transient CVs)
# → the R2 bucket armada-storage-backup: current/<bucket>/<path> (incremental), replaced / deleted files kept under
# deleted/<date>/ for 90 days, then the check that current/ matches Storage. A failed run or a mismatch emails the
# dashboard's active admins (the deploy alert's sender and recipients) «فشل النسخ الاحتياطي الأسبوعي للصور».
name: Storage backup to R2

on:
  schedule:
    # Friday 03:00 Asia/Riyadh = Friday 00:00 UTC
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only — nothing written to R2'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    name: backup · Storage → R2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/storage-backup.mjs
            scripts/site-deploy-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the S3 client (R2 speaks the S3 API)
        run: npm install --no-save --no-audit --no-fund @aws-sdk/client-s3@3.700.0
      - name: Back up
        env:
          PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: armada-storage-backup
          BACKUP_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/storage-backup.mjs
      - name: Keep the result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-result
          path: backup-result.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Email the admins
        if: ${{ failure() }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
        run: node scripts/site-deploy-report.mjs backup
