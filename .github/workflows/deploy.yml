name: Build, QA and deploy to GitHub Pages

# Media (dashboard «الصور», 1 Nov 2026): every build reads the photos published from the dashboard (scripts/media-build.mjs
# through build.py — the service-role key below), with the derived files cached between runs (.media-cache, keyed by
# each original's sha256 + focal point + the specs). A publish in the dashboard dispatches this workflow with its job
# (`media_job`); the `report` job tells the dashboard published / failed with this run's link. `dry_run` builds and
# uploads the site as an artifact without deploying (`media_sample` adds the generated sample set instead of the
# published photos — the publish-time measurement); a dry run never takes the Pages concurrency slot.
# Offers (dashboard «العروض», 2 Nov 2026): the site shows an offer only between its start and end dates (Riyadh days),
# so a scheduled build at 00:07 Riyadh (21:07 UTC) brings in the offers that start today and drops the ones that ended
# yesterday — the pages, the announcement bar and the pop-up (the browser also hides an ended offer before that run).
# Checks (9 Nov 2026, Ahmed — the local hooks keep only the fast checks; CLAUDE.md §11): every run — push, schedule,
# dashboard publish, watchdog, dry run — checks the site it is about to publish before anything is deployed:
#   checks-static   its own build without the service key (like the developer's machine), qa.py, every static check
#                   (the dashboard's browser checks included) and the sample qa
#   checks-windows  the emails' A4 print, measured with the readers' system fonts (Segoe UI, Tahoma) on Windows
#   checks-browser  the browser checks in parallel shards (scripts/check-plan.mjs CI_SHARDS) against THIS run's build
#                   (dist/ and the generated content files, handed over as the `site-build` artifact)
#   checks-pixel    pushes only: the pushed range's parent and this commit each built and every page compared — blocking
#                   when every pushed commit carries the trailer `Armada-Invisible: yes`, a report otherwise
# `deploy` needs all of them; a failure stops the deploy, the dashboard's publish job is settled as failed and the
# `status` job alerts the admins as for any failed run.
on:
  schedule:
    - cron: '7 21 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      media_job:
        description: dashboard publish job (set by the site-rebuild function)
        required: false
        default: ''
      dry_run:
        description: build and report the artifact without deploying
        type: boolean
        default: false
      media_sample:
        description: dry run only — build with the generated media sample (scripts/media-sample.mjs)
        type: boolean
        default: false
      trigger:
        description: who asked (dashboard = site-rebuild / blog-due, watchdog = the deploy watchdog; empty = by hand) — named in the deploy alert
        required: false
        default: ''
      pixel_before:
        description: by hand only — also run the pixel guard against this commit (a push runs it against the pushed range)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, never cancelled midway (6 Nov 2026 — GitHub's recommended setting for Pages): a run waits for the
# running one to finish; a newer request replaces the one still waiting, so the waiting requests collapse into the last
# one, which reads every change (room availability, fees, publishes) when it starts. Its report settles every publish
# job created before its media manifest — the replaced runs' jobs included.
concurrency:
  group: ${{ inputs.dry_run && 'pages-dry-run' || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Repository → Settings → Variables / Secrets. Never commit real values.
      PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      # Internal review on the project site: set the variable to "/armadaresidence-website"; delete it (and restore
      # public/CNAME) when the custom domain takes over — the build then serves from the root unchanged.
      PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
      # the published photos (read-only use: the media manifest, the originals, the job reports). Absent → no media step
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MEDIA_JOB: ${{ inputs.media_job }}
      MEDIA_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      MEDIA_FIXTURE: ${{ inputs.dry_run && inputs.media_sample && '.media-sample' || '' }}
    outputs:
      manifest_at: ${{ steps.media.outputs.manifest_at }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the project's Node (package.json engines) before any node command (13 Nov 2026)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # the dashboard's «حالة تحديث الموقع» (6 Nov 2026): this run has started (never fails the build)
      - name: Report the start to the dashboard
        if: ${{ !inputs.dry_run }}
        run: node scripts/site-deploy-report.mjs running
        env:
          TRIGGER: ${{ inputs.trigger }}
      - name: A media sample is for dry runs only
        if: ${{ inputs.media_sample && !inputs.dry_run }}
        run: |
          echo "::error::media_sample needs dry_run — a sample is never deployed"
          exit 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: The browser-check shards (scripts/check-plan.mjs CI_SHARDS)
        id: shards
        run: echo "shards=$(node scripts/check-plan.mjs --shards-json)" >> "$GITHUB_OUTPUT"
      - name: Media cache (derived photos of earlier builds)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .media-cache
          key: media-${{ github.run_id }}
          restore-keys: media-
      - name: Media plan (ffmpeg only when a hero video or a HEIC photo must be processed)
        id: plan
        run: |
          if [ -n "$MEDIA_FIXTURE" ]; then echo "ffmpeg=true" >> "$GITHUB_OUTPUT"; else node scripts/media-build.mjs --plan; fi
      - name: ffmpeg
        if: ${{ steps.plan.outputs.ffmpeg == 'true' }}
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Media sample (dry run)
        if: ${{ env.MEDIA_FIXTURE != '' }}
        run: node scripts/media-sample.mjs .media-sample
      - name: Build (build.py → media → astro build)
        id: media
        run: |
          python build.py
          if [ -f .media-build/report.json ]; then
            echo "manifest_at=$(node -e "process.stdout.write(require('./.media-build/report.json').manifest_at || '')")" >> "$GITHUB_OUTPUT"
          fi
      - name: QA gate (qa.py exits non-zero on any failure)
        run: python qa.py
      - name: Sub-path rewrite for the project site (no-op when PUBLIC_BASE_PATH is empty)
        run: python scripts/base-path.py
      # the browser checks judge exactly this build: dist/ and the content files the build generated (they read them)
      - name: Pack the build for the check jobs
        run: |
          tar -cf site-build.tar dist $(ls -d content/*.generated.json content/articles.generated supabase/functions/booking-request/content.generated.json 2>/dev/null)
          ls -lh site-build.tar
      - name: Hand the build to the check jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: site-build.tar
          retention-days: 3
          compression-level: 0
      - name: Save the media cache
        if: ${{ always() && hashFiles('.media-cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .media-cache
          key: media-${{ github.run_id }}
      - name: Dry run — the built site as an artifact (nothing deployed)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dry-run
          path: |
            dist
            .media-build/report.json
          retention-days: 7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ !inputs.dry_run }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !inputs.dry_run }}
        with:
          path: dist
          # v4+ leaves dotfiles out by default; dist/.nojekyll (qa.py requires it) stays in the artifact as before
          include-hidden-files: true

  # the static checks, as on the developer's machine (no service key: the published photos, offers and texts are not
  # built here — the samples are) + the static checks that open a browser (the dashboard's sidebar and «السجل», the
  # emails' print layout) + the sample qa
  checks-static:
    name: checks · static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix admin
      # its browser checks (the dashboard's sidebar, «السجل», «الغرف») use the runner's Google Chrome: nothing to
      # install, no apt (11 Nov 2026)
      - name: Run the static checks
        run: node scripts/check-all.mjs --ci-static

  # the emails' A4 print (email-print-check) on Windows: the emails name 'Segoe UI', Tahoma and Arial after IBM Plex
  # Sans Arabic (which readers do not have) — Linux has none of them, so the page is measured where they exist
  checks-windows:
    name: checks · emails print (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      # Playwright's browsers from the cache, keyed on the installed Playwright version (9 Nov 2026): a slow
      # download (15 min once on a GitHub incident day) can no longer eat a job's time limit
      - name: Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Browsers from the cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-webkit
      - name: Browsers (webkit; Google Chrome is on the runner) — downloaded only on a cache miss
        if: ${{ steps.pw-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install webkit
      - name: Run the print check
        run: node scripts/check-all.mjs --ci-windows

  # the browser checks, in parallel, against this run's build (the site-build artifact)
  checks-browser:
    name: checks · browser (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    # the official Playwright image (11 Nov 2026 — DECISIONS.md «Browser checks in the Playwright image»): Chromium,
    # WebKit and their system libraries are in the image, so no apt and no download — a mirror outage cannot block a
    # deploy (two did on 11 Nov). The tag = the installed Playwright version (deploy-alert-check asserts it).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    timeout-minutes: 20 # about 3x the longest shard (~7 min); a hung check must not hold the run (9 Nov 2026)
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: This run's build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
      - run: tar -xf site-build.tar && rm site-build.tar
      - name: Run the browser checks
        env:
          ARMADA_PW_BUNDLED: '1'
          # team-device-check (11 Nov 2026): the internal device's token, to exercise ?team=<token>
          TEAM_DEVICE_TOKEN: ${{ secrets.TEAM_DEVICE_TOKEN }}
        run: NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/pw-bundled.mjs" node scripts/check-all.mjs --shard ${{ matrix.shard }}

  # the pixel guard on a push (or by hand with pixel_before): the pushed range's parent and this commit, both built
  # without the service key, every page AR + EN × 375 + 1440 × light + dark compared pixel by pixel
  checks-pixel:
    name: checks · pixel guard
    if: ${{ (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') || inputs.pixel_before != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      PIXEL_BEFORE: ${{ github.event_name == 'push' && github.event.before || inputs.pixel_before }}
      PIXEL_SHOTS: ${{ github.workspace }}/pixel-shots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Pixel guard
        run: node scripts/check-all.mjs --pixel "$PIXEL_BEFORE"
      - name: The differing pixels (when any)
        if: ${{ always() && hashFiles('pixel-shots/after/_diff/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-diff
          path: pixel-shots/after/_diff
          retention-days: 7

  deploy:
    needs: [build, checks-static, checks-windows, checks-browser, checks-pixel]
    # every check job passed (the pixel guard may be skipped: not a push); a dry run never deploys
    if: ${{ !inputs.dry_run && !cancelled() && needs.build.result == 'success' && needs.checks-static.result == 'success' && needs.checks-windows.result == 'success' && needs.checks-browser.result == 'success' && (needs.checks-pixel.result == 'success' || needs.checks-pixel.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      # 20 minutes, not the action's default 10 (9 Nov 2026): that day GitHub's Pages backend left several deploys in
      # «syncing_files» / «deployment_queued» past 10 minutes (the same 175 MB artifact deploys in 8–16 s when it
      # works), and each timeout failed the whole run; a slow sync now has time to finish
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 1200000

  # the dashboard's publish jobs: published / failed with this run's link. A run cancelled midway (by hand — the
  # concurrency group never cancels a running deploy) puts its own job back to «queued» (never left «building»): the
  # next run's manifest settles it, and the deploy watchdog dispatches one for it after 20 minutes at the latest. A run
  # replaced while still waiting never started: its job stays queued for the run that replaced it.
  report:
    needs: [build, checks-static, checks-windows, checks-browser, checks-pixel, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MEDIA_JOB: ${{ inputs.media_job }}
      MEDIA_MANIFEST_AT: ${{ needs.build.outputs.manifest_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/media-job.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Report to the dashboard
        run: |
          if [ "${{ contains(needs.*.result, 'cancelled') && 'cancelled' || 'no' }}" = "cancelled" ]; then
            node scripts/media-job.mjs requeue
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/media-job.mjs dry ${{ needs.build.result == 'success' && 'ok' || 'fail' }}
          else
            node scripts/media-job.mjs settle ${{ needs.build.result == 'success' && needs.deploy.result == 'success' && 'ok' || 'fail' }}
          fi

  # the run's outcome for the dashboard (public.site_deploys) — and, when it failed, ONE alert email to the admins with
  # the commit, the failed step and this run's link (Edge Function site-deploy-report; 6 Nov 2026: from the evening of
  # 5 Nov every build failed qa.py and nobody knew). always(): a cancelled run reports `cancelled` (never an alert); dry runs never report.
  status:
    needs: [build, checks-static, checks-windows, checks-browser, checks-pixel, deploy]
    if: ${{ always() && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      # the build and its checks as one result: success only when every check job passed (the pixel guard may be skipped)
      BUILD_RESULT: ${{ (needs.build.result == 'success' && needs.checks-static.result == 'success' && needs.checks-windows.result == 'success' && needs.checks-browser.result == 'success' && (needs.checks-pixel.result == 'success' || needs.checks-pixel.result == 'skipped')) && 'success' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'failure') }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      TRIGGER: ${{ inputs.trigger }}
      MEDIA_JOB: ${{ inputs.media_job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/site-deploy-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Report the outcome (and alert on a failure)
        run: node scripts/site-deploy-report.mjs final
