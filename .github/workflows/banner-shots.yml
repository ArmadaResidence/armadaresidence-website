name: Cookie banner screenshots (by hand)

# The cookie banner, AR + EN × 375 + 1280 × light + dark (Ahmed, 11 Nov 2026 — DECISIONS.md 2026-11-11 «Cookie banner
# design»): `scripts/cookie-banner-shots.mjs` against the live site (or another URL), the PNGs as the artifact
# `banner-<label>`. In GitHub Actions because this machine runs no browser. Nothing is sent (GTM and pixels stubbed).
on:
  workflow_dispatch:
    inputs:
      label:
        description: the screenshots' label (e.g. before / after)
        required: true
      url:
        description: the site (empty = content/seo.json → live_url)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    # the official Playwright image (11 Nov 2026 — DECISIONS.md «Browser checks in the Playwright image»): Chromium,
    # WebKit and their system libraries are in the image, so no apt and no download — a mirror outage cannot block a
    # deploy (two did on 11 Nov). The tag = the installed Playwright version (deploy-alert-check asserts it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shoot
        run: |
          URL="${{ inputs.url }}"
          [ -n "$URL" ] || URL=$(node -e "process.stdout.write(require('./content/seo.json').live_url.replace(/\/$/, ''))")
          echo "### $URL — /version.json" >> "$GITHUB_STEP_SUMMARY"
          { echo '```json'; node -e "fetch(process.argv[1]).then((r) => r.text()).then((t) => process.stdout.write(t)).catch(() => process.stdout.write('{}'))" "$URL/version.json?v=$(date +%s)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ARMADA_PW_BUNDLED=1 NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/pw-bundled.mjs" node scripts/cookie-banner-shots.mjs "$URL" screenshots/cookie-banner "${{ inputs.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: banner-${{ inputs.label }}
          path: screenshots/cookie-banner/
          retention-days: 30
