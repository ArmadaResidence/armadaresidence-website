# Server checks (Ahmed, 11 Nov 2026 — DECISIONS.md 2026-11-11 «Internal devices and the booking source»): the database
# and the booking function, proved on the runner — free (public repository), never against a Supabase project.
#   sql      — `supabase db start`: a LOCAL Postgres with every migration of this commit applied to an empty database,
#              then the SQL test files (each one transaction, rolled back) through scripts/sql-test-run.mjs, which refuses
#              any database that is not localhost.
#   function — `deno check` of wa-automation and hub-admin (Guest Hub H2, 13 Nov 2026), then the real booking-request
#              function under Deno against a stub Supabase origin
#              (scripts/booking-source-server-check.mjs): a forged «مصدر الحجز» is stored as website; the team token
#              (repository secret TEAM_DEVICE_TOKEN) is needed for a staff source.
# Runs on a push to main that touches the database, the functions or these checks, and by hand.
name: Server checks

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/booking-request/**'
      - 'supabase/functions/wa-automation/**'
      - 'supabase/functions/_shared/hub/**'
      - 'supabase/functions/hub-admin/**'
      - 'supabase/functions/hub-agent/**'
      - 'content/team.json'
      - 'scripts/sql-test-run.mjs'
      - 'scripts/booking-source-server-check.mjs'
      - 'scripts/hub-staff-path-local.mjs'
      - '.github/workflows/server-checks.yml'
  workflow_dispatch:
    inputs:
      files:
        description: SQL test files of supabase/tests (space-separated)
        required: false
        default: booking-source.sql guest_hub_units.sql guest_hub_ingest.sql guest_hub_retention.sql guest_hub_inbox.sql guest_hub_knowledge.sql guest_hub_assistant.sql guest_hub_lab.sql guest_hub_radar.sql guest_hub_pass4.sql guest_hub_team.sql guest_hub_media.sql guest_hub_send_watch.sql guest_hub_learning.sql guest_hub_booking.sql guest_hub_departures.sql guest_hub_h9_fix1.sql guest_hub_standby.sql guest_hub_fix3.sql guest_hub_fix4.sql guest_hub_h10.sql offer-packages.sql breakfast-fees.sql wa-automation.sql

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sql:
    name: server · SQL tests (local database)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0
      - name: The local database (every migration of this commit)
        run: supabase db start
      - name: The SQL tests
        run: node scripts/sql-test-run.mjs ${{ inputs.files || 'booking-source.sql guest_hub_units.sql guest_hub_ingest.sql guest_hub_retention.sql guest_hub_inbox.sql guest_hub_knowledge.sql guest_hub_assistant.sql guest_hub_lab.sql guest_hub_radar.sql guest_hub_pass4.sql guest_hub_team.sql guest_hub_media.sql guest_hub_send_watch.sql guest_hub_learning.sql guest_hub_booking.sql guest_hub_departures.sql guest_hub_h9_fix1.sql guest_hub_standby.sql guest_hub_fix3.sql guest_hub_fix4.sql guest_hub_h10.sql offer-packages.sql breakfast-fees.sql wa-automation.sql' }}

  function:
    name: server · functions (Deno — hub type-check, booking-request on a stub database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: The function's generated content
        run: python build.py --content-only
      - name: The Guest Hub functions type-check (Deno; session H2)
        run: deno check supabase/functions/wa-automation/index.ts supabase/functions/hub-admin/index.ts supabase/functions/hub-agent/index.ts
      - name: «مصدر الحجز» on the server
        env:
          TEAM_DEVICE_TOKEN: ${{ secrets.TEAM_DEVICE_TOKEN }}
        run: node scripts/booking-source-server-check.mjs

  # Guest Hub H9 fix 4 (Ahmed, 18 Nov 2026): the staff path's stage times, end to end on the runner — every migration of this
  # commit, wa-automation served as written, signed YCloud events (scripts/hub-staff-path-local.mjs). No YCloud and no model
  # key exist here: the time measured is OUR part, up to the moment a reply would go to YCloud.
  staff-path:
    name: server · the staff path (local stack, signed events)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0
      - name: The function's generated content
        run: python build.py --content-only
      - name: The local stack (every migration of this commit)
        run: supabase start -x studio,imgproxy,logflare,vector
      - name: wa-automation served
        run: |
          nohup supabase functions serve wa-automation --no-verify-jwt > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:54321/functions/v1/wa-automation" -H 'Content-Type: application/json' -d '{}' || true)
            # the function's own answer to an unsigned call (401) — never the gateway's while it boots (000 / 404 / 5xx)
            if [ "$code" = "401" ] || [ "$code" = "400" ]; then echo "served ($code)"; break; fi
            sleep 2
          done
      - name: The staff path's stage times
        run: node scripts/hub-staff-path-local.mjs
      - name: The function's own timing lines (numbers only)
        if: always()
        run: grep -E "hub staff timing|staff typing|wa-automation:" "$RUNNER_TEMP/functions.log" | tail -40 || true
