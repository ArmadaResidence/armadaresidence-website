# Server checks (Ahmed, 11 Nov 2026 — DECISIONS.md 2026-11-11 «Internal devices and the booking source»): the database
# and the booking function, proved on the runner — free (public repository), never against a Supabase project.
#   sql      — `supabase db start`: a LOCAL Postgres with every migration of this commit applied to an empty database,
#              then the SQL test files (each one transaction, rolled back) through scripts/sql-test-run.mjs, which refuses
#              any database that is not localhost.
#   function — `deno check` of wa-automation and hub-admin (Guest Hub H2, 13 Nov 2026), then the real booking-request
#              function under Deno against a stub Supabase origin
#              (scripts/booking-source-server-check.mjs): a forged «مصدر الحجز» is stored as website; the team token
#              (repository secret TEAM_DEVICE_TOKEN) is needed for a staff source.
# Runs on a push to main that touches the database, the functions or these checks, and by hand.
name: Server checks

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/booking-request/**'
      - 'supabase/functions/wa-automation/**'
      - 'supabase/functions/_shared/hub/**'
      - 'supabase/functions/hub-admin/**'
      - 'content/team.json'
      - 'scripts/sql-test-run.mjs'
      - 'scripts/booking-source-server-check.mjs'
      - '.github/workflows/server-checks.yml'
  workflow_dispatch:
    inputs:
      files:
        description: SQL test files of supabase/tests (space-separated)
        required: false
        default: booking-source.sql guest_hub_units.sql guest_hub_ingest.sql guest_hub_retention.sql guest_hub_inbox.sql wa-automation.sql

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sql:
    name: server · SQL tests (local database)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0
      - name: The local database (every migration of this commit)
        run: supabase db start
      - name: The SQL tests
        run: node scripts/sql-test-run.mjs ${{ inputs.files || 'booking-source.sql guest_hub_units.sql guest_hub_ingest.sql guest_hub_retention.sql guest_hub_inbox.sql wa-automation.sql' }}

  function:
    name: server · functions (Deno — hub type-check, booking-request on a stub database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: The function's generated content
        run: python build.py --content-only
      - name: The Guest Hub functions type-check (Deno; session H2)
        run: deno check supabase/functions/wa-automation/index.ts supabase/functions/hub-admin/index.ts
      - name: «مصدر الحجز» on the server
        env:
          TEAM_DEVICE_TOKEN: ${{ secrets.TEAM_DEVICE_TOKEN }}
        run: node scripts/booking-source-server-check.mjs
